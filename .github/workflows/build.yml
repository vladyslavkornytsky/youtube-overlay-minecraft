name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Create Gradle Files for Build
        run: |
          # Создаем структуру папок мода
          mkdir -p src/main/java/com/example/youtubeoverlay
          mkdir -p src/main/resources
          
          # Перемещаем ваши файлы на свои места
          mv -f VideoOverlayGui.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeKeyBinding.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeOverlayMod.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeScreen.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f fabric.mod.json src/main/resources/ 2>/dev/null || true

          # Создаем минимальный settings.gradle
          echo 'rootProject.name = "youtube-overlay"' > settings.gradle

      - name: Build with Gradle CLI
        run: |
          # Скачиваем gradle сборщик прямо на сервер для компиляции мода под Fabric
          gradle wrapper --gradle-version 8.5
          ./gradlew build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-overlay-mod-jar
          path: build/libs/*.jar
