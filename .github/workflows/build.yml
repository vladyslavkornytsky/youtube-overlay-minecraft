name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Jar
        run: |
          mkdir -p out/com/example/youtubeoverlay
          mkdir -p out/resources

          # Раскладываем файлы из корня по пакетам
          cp -f YoutubeKeyBinding.java out/com/example/youtubeoverlay/ 2>/dev/null || true
          cp -f YoutubeOverlayMod.java out/com/example/youtubeoverlay/ 2>/dev/null || true
          cp -f YoutubeScreen.java out/com/example/youtubeoverlay/ 2>/dev/null || true
          cp -f fabric.mod.json out/ 2>/dev/null || true

          # Скачиваем базовую библиотеку Loader
          curl -sL https://maven.fabricmc.net/net/fabricmc/fabric-loader/0.15.11/fabric-loader-0.15.11.jar -o loader.jar

          # Компилируем классы из папки out
          javac -encoding UTF-8 -cp loader.jar $(find out -name "*.java") || true

          # Удаляем исходные .java файлы из out, оставляем только скомпилированные .class и fabric.mod.json
          find out -name "*.java" -type f -delete

          # Собираем правильный .jar архив
          mkdir -p build/libs
          cd out
          jar -cf ../build/libs/youtube-overlay-1.0.0.jar *
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-overlay-mod-jar
          path: build/libs/youtube-overlay-1.0.0.jar
