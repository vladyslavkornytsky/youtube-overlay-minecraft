name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Project Structure
        run: |
          mkdir -p src/main/java/com/example/youtubeoverlay
          mkdir -p src/main/resources
          
          # Перемещаем исходные файлы на свои места
          mv -f VideoOverlayGui.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeKeyBinding.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeOverlayMod.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeScreen.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f fabric.mod.json src/main/resources/ 2>/dev/null || true

          # Создаем файлы конфигурации Gradle
          echo 'rootProject.name = "youtube-overlay-mod"' > settings.gradle

          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version '1.6-SNAPSHOT'
              id 'maven-publish'
          }

          version = "1.0.0"
          group = "com.example"

          repositories {
              maven { url "https://maven.fabricmc.net" }
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:26.2"
              mappings "net.fabricmc:yarn:26.2+build.1:v2"
              modImplementation "net.fabricmc:fabric-loader:0.19.5"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.161.0+26.2"
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
          }
          EOF

      - name: Build with Gradle
        run: gradle build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-overlay-mod-jar
          path: build/libs/*.jar
