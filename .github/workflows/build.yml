name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile and Build Mod Jar
        run: |
          mkdir -p build/libs
          mkdir -p src/main/java/com/example/youtubeoverlay
          mkdir -p src/main/resources
          mkdir -p out

          # 1. Перемещаем исходные файлы по правильной структуре пакетов
          mv -f VideoOverlayGui.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeKeyBinding.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeOverlayMod.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeScreen.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f fabric.mod.json src/main/resources/ 2>/dev/null || true

          # 2. Компилируем .java файлы в исполняемые .class файлы (с учетом Fabric API)
          javac -d out $(find src/main/java -name "*.java")

          # 3. Добавляем конфигурационный файл Fabric в корень сборки
          cp -r src/main/resources/* out/ 2>/dev/null || true

          # 4. Запаковываем скомпилированные классы в готовый архив мода
          cd out
          jar -cf ../build/libs/youtube-overlay-1.0.0.jar *
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-overlay-mod-jar
          path: build/libs/*.jar
