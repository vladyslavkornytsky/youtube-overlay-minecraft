name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Direct Jars and Compile
        run: |
          mkdir -p build/libs
          mkdir -p src/main/java/com/example/youtubeoverlay
          mkdir -p src/main/resources
          mkdir -p out

          # Раскладываем файлы мода по папкам
          mv -f YoutubeKeyBinding.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeOverlayMod.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeScreen.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f fabric.mod.json src/main/resources/ 2>/dev/null || true

          # Скачиваем точные зависимости с официального maven Fabric
          curl -sL https://maven.fabricmc.net/net/fabricmc/intermediary/26.2/intermediary-26.2.jar -o intermediary.jar
          curl -sL https://maven.fabricmc.net/net/fabricmc/fabric-loader/0.20.1/fabric-loader-0.20.1.jar -o loader.jar
          curl -sL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.161.0+26.2/fabric-api-0.161.0+26.2.jar -o fabric-api.jar

          # Компилируем классы, используя скачанный classpath
          javac -encoding UTF-8 -cp "intermediary.jar:loader.jar:fabric-api.jar" -d out $(find src/main/java -name "*.java")
          cp -r src/main/resources/* out/ 2>/dev/null || true

          # Упаковываем в готовый .jar архив
          cd out
          jar -cf ../build/libs/youtube-overlay-1.0.0.jar *
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-overlay-mod-jar
          path: build/libs/youtube-overlay-1.0.0.jar
