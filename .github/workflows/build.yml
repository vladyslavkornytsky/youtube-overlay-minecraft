name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Generate Fabric Project Structure & Build Files
        run: |
          mkdir -p src/main/java/com/example/youtubeoverlay
          mkdir -p src/main/resources
          
          # Перемещаем Java-файлы и ресурсы по правильным папкам
          mv -f VideoOverlayGui.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeKeyBinding.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeOverlayMod.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeScreen.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f fabric.mod.json src/main/resources/ 2>/dev/null || true

          # Создаем settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "youtube-overlay-mod"
          EOF

          # Создаем build.gradle с поддержкой Fabric Loom
          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version '1.6-SNAPSHOT'
              id 'maven-publish'
          }

          version = "1.0.0"
          group = "com.example"

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:1.21"
              mappings "net.fabricmc:yarn:1.21+build.1:v2"
              modImplementation "net.fabricmc:fabric-loader:0.15.11"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.97.0+1.21"
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

      - name: Build with Gradle
        run: |
          gradle wrapper --gradle-version 8.8
          ./gradlew build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-overlay-mod-jar
          path: build/libs/*.jar
