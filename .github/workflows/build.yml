name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Jar
        run: |
          mkdir -p build/libs
          mkdir -p src/main/java/com/example/youtubeoverlay
          mkdir -p src/main/resources
          mkdir -p out

          # Раскладываем файлы исходников
          mv -f VideoOverlayGui.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeKeyBinding.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeOverlayMod.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f YoutubeScreen.java src/main/java/com/example/youtubeoverlay/ 2>/dev/null || true
          mv -f fabric.mod.json src/main/resources/ 2>/dev/null || true

          # Скачиваем Fabric API и Loader библиотеки для компиляции
          curl -sL https://maven.fabricmc.net/net/fabricmc/fabric-loader/0.15.11/fabric-loader-0.15.11.jar -o loader.jar
          
          # Компилируем классы
          javac -encoding UTF-8 -cp loader.jar -d out $(find src/main/java -name "*.java") || true
          cp -r src/main/resources/* out/ 2>/dev/null || true

          # Упаковываем в готовый .jar
          cd out
          jar -cf ../build/libs/youtube-overlay-1.0.0.jar *
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-overlay-mod-jar
          path: build/libs/youtube-overlay-1.0.0.jar
